name: IndexNow

# Tells Bing, Yandex, Seznam and Naver that the site changed, instead of waiting for them to
# rediscover it. Google does not participate in IndexNow — Search Console covers that side.
#
# Runs only when the site itself changed on main. Vercel deploys from the same push, so this
# fires alongside the deploy rather than after a confirmed one; the URLs are stable and
# already published, so submitting a moment early is harmless.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/scripts/ping-indexnow.mjs"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Submit sitemap URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run site:build
      - name: Submit to IndexNow
        run: node .github/scripts/ping-indexnow.mjs apps/site/dist
